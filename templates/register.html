{% extends "layout.html" %}

{% block title %} Purjelentokerho {% endblock %}

{% block subtitle %} Lisää uusi käyttäjä {% endblock %}

{% block content %}
<form action="/create" method="post">
  <p>
    Tunnus: <br />
    <input type="text" name="username" maxlength="10" required />
  </p>
  <p>
    Salasana: <br />
    <input type="password" name="password1" maxlength="20" required />
  </p>
  <p>
    Salasana uudestaan: <br />
    <input type="password" name="password2" maxlength="20" required />
  </p>
  <input type="submit" value="Luo tunnus" />
</form>
{% endblock %}
